<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile — CI/CD Homework App</title>
  <style>
    body    { font-family: system-ui, sans-serif; max-width: 480px; margin: 60px auto; padding: 0 1rem; color: #222; }
    .card   { border: 1px solid #ddd; border-radius: 10px; padding: 2rem; text-align: center; }
    img     { width: 88px; height: 88px; border-radius: 50%; margin-bottom: 1rem; }
    h2      { margin: 0 0 0.25rem; font-size: 1.4rem; }
    .email  { color: #555; margin-bottom: 0.5rem; }
    .secret { color: #555; font-size: 0.85rem; margin-bottom: 1.5rem; }
    .result { background: #f5f5f5; border-radius: 6px; padding: 1rem; text-align: left;
              font-family: monospace; font-size: 0.85rem; white-space: pre; overflow-x: auto; margin-bottom: 1.5rem; }
    a.logout { color: #c00; font-size: 0.9rem; text-decoration: none; }
    a.logout:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="card">
    {% if picture %}
    <img src="{{ picture }}" alt="Profile picture">
    {% endif %}
    <h2>{{ name }}</h2>
    <p class="email">{{ email }}</p>
    <p class="secret">APP_SECRET: <code>{{ masked_secret }}</code></p>
    <div class="result">{{ result_content }}</div>
    <a class="logout" href="/logout">Sign out</a>
  </div>
</body>
</html>
