name: CI

on:
  push:
    branches:
      - main
      - oauth
      - web
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    name: Build, Test & Package
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4

      # ── 2. Set up Python ──────────────────────────────────────────────────
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      # ── 3. Verify required secrets are configured ─────────────────────────
      #       Fail fast before wasting time on install/test if secrets missing.
      - name: Verify required secrets
        env:
          APP_SECRET: ${{ secrets.APP_SECRET }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          missing=()
          [[ -z "${APP_SECRET}" ]]            && missing+=("APP_SECRET")
          [[ -z "${GOOGLE_CLIENT_SECRET}" ]]  && missing+=("GOOGLE_CLIENT_SECRET")
          if [[ ${#missing[@]} -gt 0 ]]; then
            echo "ERROR: Missing required GitHub secrets: ${missing[*]}"
            echo "Add them under: Settings → Secrets and variables → Actions → New repository secret"
            exit 1
          fi
          echo "All required secrets are present."

      # ── 4. Run Bash setup script ──────────────────────────────────────────
      #       Tests use Flask test client — no browser or live Google needed.
      #       APP_SECRET and GOOGLE_CLIENT_SECRET are injected from the vault.
      #       GOOGLE_CLIENT_ID is committed in app/main.py (not sensitive).
      - name: Run setup, test, and package
        env:
          APP_SECRET: ${{ secrets.APP_SECRET }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: bash scripts/setup.sh

      # ── 5. Upload artifacts ───────────────────────────────────────────────
      - name: Upload app artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-tarball
          path: dist/app.tar.gz
          if-no-files-found: warn

      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-log
          path: logs/test.log
          if-no-files-found: warn

      # ── 6. Report result ──────────────────────────────────────────────────
      - name: Report status
        if: always()
        run: |
          if [[ "${{ job.status }}" == "success" ]]; then
            echo "✅ CI passed — all steps completed successfully."
          else
            echo "❌ CI failed — review the logs and uploaded artifacts above."
            exit 1
          fi
