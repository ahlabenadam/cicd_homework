name: Auto-merge

# Triggered when the CI workflow completes (pass or fail) on a pull_request event.
# Reads the workflow result and either squash-merges the PR or marks it as rejected.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: write       # required to merge
  pull-requests: write  # required to comment and label

jobs:

  # ── Merge ─────────────────────────────────────────────────────────────────
  # Runs only when CI passed AND the triggering event was a pull_request to main.
  auto-merge:
    name: Squash-merge PR
    runs-on: ubuntu-latest
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      (github.event.workflow_run.event == 'pull_request' ||
       github.event.workflow_run.event == 'pull_request_target') &&
      github.event.workflow_run.head_branch != 'main'

    steps:
      - name: Find PR number for this commit
        id: find-pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          REPO: ${{ github.repository }}
        run: |
          PR_NUMBER=$(gh pr list \
            --repo "$REPO" \
            --state open \
            --base main \
            --json number,headRefOid \
            --jq ".[] | select(.headRefOid == \"$HEAD_SHA\") | .number")

          if [[ -z "$PR_NUMBER" ]]; then
            echo "No open PR found for commit $HEAD_SHA — already merged or closed. Skipping."
            echo "pr_number=" >> "$GITHUB_OUTPUT"
          else
            echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          fi

      - name: Squash-merge the PR
        if: steps.find-pr.outputs.pr_number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.find-pr.outputs.pr_number }}
        run: |
          gh pr merge "$PR_NUMBER" \
            --repo "$REPO" \
            --squash \
            --delete-branch \
            --subject "Auto-merge PR #$PR_NUMBER (CI passed)" \
            --body "Automatically merged after all CI checks passed."

      - name: Get artifact page URL
        id: artifact
        if: steps.find-pr.outputs.pr_number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          REPO: ${{ github.repository }}
        run: |
          PAGE_URL="https://github.com/$REPO/actions/runs/$RUN_ID#artifacts"
          echo "url=$PAGE_URL" >> "$GITHUB_OUTPUT"

      - name: Comment — merged successfully
        if: steps.find-pr.outputs.pr_number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.find-pr.outputs.pr_number }}
          ARTIFACT_URL: ${{ steps.artifact.outputs.url }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          gh pr comment "$PR_NUMBER" \
            --repo "$REPO" \
            --body "✅ **CI passed** — this PR has been squash-merged into \`main\` automatically.

          **CI logs:** $RUN_URL
          **Download artifact:** [app.tgz]($ARTIFACT_URL)
          *(Requires GitHub login to download)*"

  # ── Reject ────────────────────────────────────────────────────────────────
  # Runs only when CI failed AND the triggering event was a pull_request to main.
  auto-reject:
    name: Mark PR as failed
    runs-on: ubuntu-latest
    if: >
      github.event.workflow_run.conclusion == 'failure' &&
      (github.event.workflow_run.event == 'pull_request' ||
       github.event.workflow_run.event == 'pull_request_target') &&
      github.event.workflow_run.head_branch != 'main'

    steps:
      - name: Find PR number for this commit
        id: find-pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          REPO: ${{ github.repository }}
        run: |
          PR_NUMBER=$(gh pr list \
            --repo "$REPO" \
            --state open \
            --base main \
            --json number,headRefOid \
            --jq ".[] | select(.headRefOid == \"$HEAD_SHA\") | .number")

          if [[ -z "$PR_NUMBER" ]]; then
            echo "No open PR found for commit $HEAD_SHA — already merged or closed. Skipping."
            echo "pr_number=" >> "$GITHUB_OUTPUT"
          else
            echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          fi

      - name: Ensure 'ci-failed' label exists
        if: steps.find-pr.outputs.pr_number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          gh label create "ci-failed" \
            --repo "$REPO" \
            --color "d73a4a" \
            --description "CI checks failed on this PR" \
            2>/dev/null || true   # ignore error if label already exists

      - name: Add 'ci-failed' label to PR
        if: steps.find-pr.outputs.pr_number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.find-pr.outputs.pr_number }}
        run: |
          gh pr edit "$PR_NUMBER" \
            --repo "$REPO" \
            --add-label "ci-failed"

      - name: Get failed job URL
        id: failed-job
        if: steps.find-pr.outputs.pr_number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          REPO: ${{ github.repository }}
        run: |
          JOB_URL=$(gh api /repos/$REPO/actions/runs/$RUN_ID/jobs \
            --jq '[.jobs[] | select(.conclusion == "failure")] | first | .html_url')
          echo "url=$JOB_URL" >> "$GITHUB_OUTPUT"

      - name: Comment — CI failed
        if: steps.find-pr.outputs.pr_number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.find-pr.outputs.pr_number }}
          JOB_URL: ${{ steps.failed-job.outputs.url }}
        run: |
          gh pr comment "$PR_NUMBER" \
            --repo "$REPO" \
            --body "❌ **CI failed** — this PR will not be merged until all checks pass.

          **Failed job logs:** $JOB_URL

          Fix the issues on your branch and push again — CI will re-run automatically.

          The \`ci-failed\` label will be removed automatically when CI passes and the PR is merged."
